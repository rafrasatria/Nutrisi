services:
  - type: web
    name: nutrisi-detektif
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Detektif Nutrisi
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Setelah deploy pertama, isi manual di dashboard:
      # APP_URL=https://<nama-service>.onrender.com (agar link & asset absolut benar)
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: nutrisi-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nutrisi-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: nutrisi-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: nutrisi-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nutrisi-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: nutrisi-db
    plan: free
    postgresMajorVersion: 16
